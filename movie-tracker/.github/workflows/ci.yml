name: CI

on:
  push:
    paths:
      - "movie-tracker/**"
  pull_request:
    paths:
      - "movie-tracker/**"

defaults:
  run:
    working-directory: movie-tracker

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: movie-tracker/services/api/pyproject.toml
      - run: python -m pip install -e ".[dev]"
        working-directory: movie-tracker/services/api
      - run: ruff check .
        working-directory: movie-tracker/services/api
      - run: ruff format --check .
        working-directory: movie-tracker/services/api
      - run: mypy app
        working-directory: movie-tracker/services/api
      - run: pytest
        working-directory: movie-tracker/services/api

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13"
          cache: npm
          cache-dependency-path: movie-tracker/package-lock.json
      - run: npm ci
      - run: npm run mobile:lint
      - run: npm run mobile:format
      - run: npm run mobile:typecheck
      - run: npm run mobile:test
